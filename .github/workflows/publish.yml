name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ci:
    name: CI checks
    uses: ./.github/workflows/ci.yml

  build:
    name: Build packages
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build

      - name: Verify wheel integrity
        # Защита от того же класса бага, что сломал SCB-сборку (wheel без
        # вложенных пакетов). Открываем собранный wheel и проверяем, что все
        # ключевые модули на месте — иначе CI падает и битый релиз не уезжает
        # в PyPI.
        run: |
          python <<'PY'
          import glob, sys, zipfile
          whls = glob.glob("dist/*.whl")
          assert whls, "no wheel produced"
          z = zipfile.ZipFile(whls[0])
          names = set(z.namelist())
          required = [
              "aiopyrus/__init__.py",
              "aiopyrus/bot/bot.py",
              "aiopyrus/bot/dispatcher.py",
              "aiopyrus/bot/router.py",
              "aiopyrus/bot/filters/__init__.py",
              "aiopyrus/bot/webhook/server.py",
              "aiopyrus/types/__init__.py",
              "aiopyrus/types/award.py",
              "aiopyrus/types/knowledge_base.py",
              "aiopyrus/types/telephony.py",
              "aiopyrus/user/client.py",
              "aiopyrus/utils/context.py",
              "aiopyrus/api/session.py",
              "aiopyrus/py.typed",
          ]
          missing = [r for r in required if r not in names]
          if missing:
              sys.exit(f"wheel is broken — missing: {missing}")
          print(f"wheel OK: {len(names)} files")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: GitHub Release
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Extract changelog for this version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md > /tmp/release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/release_notes.md
